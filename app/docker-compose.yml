# docker-compose.yml — Multi-service production deployment
version: '3.8'

services:
  # ============================================================
  # Redis — Message broker & cache for Celery
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: analise_textos_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ============================================================
  # Backend API — FastAPI
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: analise_textos_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-24}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000}
      - AUTH_RATE_LIMIT=${AUTH_RATE_LIMIT:-10/minute}
      - UPLOAD_RATE_LIMIT=${UPLOAD_RATE_LIMIT:-30/minute}
      - PIPELINE_RATE_LIMIT=${PIPELINE_RATE_LIMIT:-5/minute}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - notebooklm_data:/root/.notebooklm
      - ./data:/app/data
      - ./arquivos_bancas:/app/arquivos_bancas
      - ./uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Celery Worker — Background pipeline processing
  # ============================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: analise_textos_worker
    env_file:
      - .env
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - notebooklm_data:/root/.notebooklm
      - ./data:/app/data
      - ./arquivos_bancas:/app/arquivos_bancas
      - ./uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  # ============================================================
  # Nginx — Reverse proxy & static files
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: analise_textos_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  notebooklm_data:
  nginx_logs: