version: '3.8'

services:
  app:
    build: .
    container_name: analise_textos_app
    ports:
      - "8000:8000"
    environment:
      # Segredos (NUNCA commitados; definidos aqui em runtime, nunca na imagem)
      - ANALISE_PASSWORD=${ANALISE_PASSWORD}
      # Em prod, restringir ao origin real do frontend
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000}
    volumes:
      # Sessão do NotebookLM sobrevive a reinício do container
      - ~/.notebooklm:/root/.notebooklm
      # Dados da aplicação (PDFs enviados, análises geradas)
      - ./Arquivos das bancas:/app/Arquivos das bancas
      - ./uploads:/app/uploads
    restart: unless-stopped
